
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Check-In | CarePoint Hospital</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/layout.js" defer></script>
</head>

<body data-page="patient">

    <div id="site-header"></div>

    <main class="wrap">

        <h1>Patient Check-In</h1>

        <p>
            Fill out the information below to submit
            a demo check-in.
        </p>

        <section class="panel">

            <h2>Patient Information</h2>

            <form id="patientForm">

                <div class="fields">

                    <label>
                        First name
                        <input
                            type="text"
                            name="first"
                            maxlength="60"
                            required
                        >
                    </label>

                    <label>
                        Last name
                        <input
                            type="text"
                            name="last"
                            maxlength="60"
                            required
                        >
                    </label>

                    <label>
                        Parent/Guardian name
                        <input
                            type="text"
                            name="guardian"
                            maxlength="120"
                            placeholder="If applicable"
                        >
                    </label>

                    <label>
                        Date of birth
                        <input
                            type="date"
                            name="dob"
                            required
                        >
                    </label>

                    <label>
                        Birth sex
                        <select name="sex" required>
                            <option value="">Select</option>
                            <option>Female</option>
                            <option>Male</option>
                            <option>Prefer not to say</option>
                        </select>
                    </label>

                    <label>
                        Medical insurance
                        <input
                            type="text"
                            name="insurance"
                            maxlength="100"
                            placeholder="Optional"
                        >
                    </label>

                    <label>
                        Email
                        <input
                            type="email"
                            name="email"
                            required
                        >
                    </label>

                    <label>
                        Phone number
                        <input
                            type="tel"
                            name="phone"
                            required
                        >
                    </label>

                    <label>
                        Reason for visit
                        <textarea
                            name="reason"
                            rows="3"
                            maxlength="300"
                            required
                        ></textarea>
                    </label>

                    <label>
                        Pain scale (0–10)
                        <select name="pain" required>
                            <option value="">Select</option>
                            <option>0</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                        </select>
                    </label>

                </div>

                <button type="submit">
                    Submit Check-In
                </button>

            </form>

        </section>

    </main>

    <div id="site-footer"></div>

    <script src="js/app.js"></script>

</body>
</html>
