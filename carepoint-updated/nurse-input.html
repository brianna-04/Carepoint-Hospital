<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Nurse Information | CarePoint Hospital
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <script defer="True" src="js/layout.js">
  </script>
 </head>
 <body data-page="nurse-input">
  <div id="site-header">
  </div>
  <main class="wrap">
   <h1>
    Nurse Information
   </h1>
   <section class="panel narrow">
    <h2>
     Start Your Shift
    </h2>
    <form id="nurseForm">
     <label>
      First name
      <input name="first" required=""/>
     </label>
     <label>
      Last name
      <input name="last" required=""/>
     </label>
     <label>
      Shift hours
      <select name="shift" required="">
       <option value="">
        Select shift
       </option>
       <option>
        7 AM &ndash; 3 PM
       </option>
       <option>
        3 PM &ndash; 11 PM
       </option>
       <option>
        11 PM &ndash; 7 AM
       </option>
      </select>
     </label>
     <button type="submit">
      Go to Nurse Dashboard
     </button>
    </form>
   </section>
  </main>
  <div id="site-footer">
  </div>
  <script src="js/app.js">
  </script>
 </body>
</html>
